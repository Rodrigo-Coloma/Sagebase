services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: medlit-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: medlit-postgres
    environment:
      POSTGRES_DB: medlit
      POSTGRES_USER: medlit
      POSTGRES_PASSWORD: medlit
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    profiles: ["jobs"]
    restart: unless-stopped

  api:
    build: .
    container_name: medlit-api
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: ["uvicorn", "medlit.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
