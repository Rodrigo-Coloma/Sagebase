services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: medlit-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: medlit-postgres
    environment:
      POSTGRES_DB: medlit
      POSTGRES_USER: medlit
      POSTGRES_PASSWORD: medlit
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    profiles: ["jobs"]
    restart: unless-stopped

  api:
    build: .
    container_name: medlit-api
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    expose:
      - "8000"
    ports:
      # Bind to localhost only — host nginx reverse-proxies the public traffic.
      # Change to "8000:8000" if you want LAN access without a reverse proxy.
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: ["uvicorn", "medlit.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Sub-path support. Set VITE_BASE_PATH and VITE_API_BASE in .env to
        # deploy under e.g. https://example.com/medlit/. Defaults to root.
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_BASE: ${VITE_API_BASE:-${VITE_BASE_PATH:-/}api}
    container_name: medlit-web
    ports:
      # Bind to localhost only — host nginx reverse-proxies the public traffic.
      # Change to "8080:80" if you want LAN access without a reverse proxy.
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
