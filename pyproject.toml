[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "medlit"
version = "0.1.0"
description = "Vectorized medical literature RAG: ingestion, embeddings, hybrid retrieval, and grounded generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sagebase" }]
keywords = ["rag", "medical", "pubmed", "vector-search", "biomedical-nlp"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "tenacity>=8.2",
    "httpx>=0.27",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "orjson>=3.10",

    # Ingestion
    "biopython>=1.83",
    "arxiv>=2.1",
    "lxml>=5.1",

    # Document processing
    "pymupdf>=1.24",
    "langchain-text-splitters>=0.2",
    "tiktoken>=0.7",

    # Embeddings & ML
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "numpy>=1.26",

    # Vector storage
    "qdrant-client>=1.10",
    "rank-bm25>=0.2.2",

    # Generation
    "anthropic>=0.39",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",

    # CLI
    "typer>=0.12",
    "rich>=13.7",

    # Scheduler
    "apscheduler>=3.10",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
voyage = ["voyageai>=0.2"]
chroma = ["chromadb>=0.5"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
unstructured = ["unstructured[pdf]>=0.14"]
ollama = ["ollama>=0.3"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
medlit = "medlit.cli.main:app"

[project.urls]
Repository = "https://github.com/rodrigo-coloma/sagebase"

[tool.hatch.build.targets.wheel]
packages = ["src/medlit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "Bio.*",
    "arxiv.*",
    "fitz",
    "rank_bm25",
    "qdrant_client.*",
    "sentence_transformers.*",
    "apscheduler.*",
    "voyageai",
    "ollama",
    "chromadb.*",
    "pgvector.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
