server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Static SPA ----------
    # Cache hashed asset bundles aggressively; never cache index.html so
    # SPA deploys take effect on next refresh.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # Client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API proxy ----------
    # The trailing slash on proxy_pass strips /api before forwarding, so
    # /api/search -> http://api:8000/search etc.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming responses must not be buffered or chunk-rewritten.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Long-running ingest jobs / streamed answers.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # File uploads up to 50 MB (matches medlit's manual ingest cap).
        client_max_body_size 50m;
    }

    # ---------- Health ----------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
